[package]
name = "freemapper-print-cli"
description = "CLI, MCP server and layout editor for freemapper-print"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "freemapper-print"
path = "src/main.rs"

[features]
# Tests only: a debug build with this feature takes FREEMAPPER_PRINT_UPDATE_TEST_BASE, counts as a release
# build and sends its update requests to that stub server (`cargo test -p freemapper-print-cli --features
# test-stub`). Release builds never have it.
test-stub = []

[dependencies]
freemapper-update.workspace = true
dirs.workspace = true
ureq.workspace = true
freemapper-print.workspace = true
clap.workspace = true
anyhow.workspace = true
axum.workspace = true
rust-embed.workspace = true
fluent-bundle.workspace = true
freemapper-text.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
freemapper-print = { workspace = true, features = ["test-hooks", "page-rules"] }
minisign-verify.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
