[package]
name = "freemapper-print"
description = "Print layouts for orienteering maps: map, course overprint, control descriptions, masks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Test hooks for the CLI's integration tests: a fake free-space value from the environment and
# the live-page counter of the export loop. Enabled only through freemapper-print-cli's
# dev-dependencies, so release binaries never read the variable.
test-hooks = []

[dependencies]
freemapper-contract.workspace = true
freemapper-course.workspace = true
freemapper-fs.workspace = true
freemapper-omap.workspace = true
freemapper-printrules.workspace = true
freemapper-render.workspace = true
freemapper-rules.workspace = true
freemapper-web.workspace = true
fs4.workspace = true
image.workspace = true
miniz_oxide.workspace = true
pdf-writer.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
toml.workspace = true
serde.workspace = true
simplecss.workspace = true
subsetter.workspace = true
svgtypes.workspace = true
ttf-parser.workspace = true
usvg.workspace = true

[target.'cfg(not(unix))'.dependencies]
same-file.workspace = true

[dev-dependencies]
freemapper-contract = { workspace = true, features = ["fixtures"] }
freemapper-printrules = { workspace = true, features = ["test-support"] }
freemapper-render = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
