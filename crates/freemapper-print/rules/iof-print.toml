# --- Control descriptions on the map -----------------------------------------------------------

[[rules]]
id = "iofprint.description.cell"
key = "description_box"
severity = "hint"
values = { cell_mm = 6.0 }
source = { doc = "IOF-CD", section = "Control description sheet format (square boxes, 5 mm to 7 mm)" }
note = { de = "6 mm ist die Mitte des Bereichs, den die Norm erlaubt; eine Wahl von freemapper-print.", en = "6 mm is the middle of the range the standard allows; a choice of freemapper-print." }

# --- Course colour (spec 5.9) -------------------------------------------------------------------

[[rules]]
id = "iofprint.colour.purple"
key = "course_colour"
severity = "warning"
values = { cyan_percent = 35, magenta_percent = 85, yellow_percent = 0, black_percent = 0 }
source = { doc = "IOF-PCD", section = "6. Colour order (upper and lower purple for course overprint)" }

# --- Control number placement ------------------------------------------------------------------

[[rules]]
id = "iofprint.placement.weights"
key = "placement_weights"
severity = "hint"
values = { black_factor = 10.0, brown_factor = 4.0, blue_factor = 4.0, other_factor = 1.0 }
source = { doc = "fmp", section = "ADR 0031" }
note = { de = "Eigene Wahl: Eine Nummer über schwarzen Kartendetails stört am meisten, über braunen und blauen weniger, über den übrigen Farben am wenigsten.", en = "Our own choice: a number over black map detail hurts legibility most, over brown and blue less, over the other colours least." }

[[rules]]
id = "iofprint.number.gap"
key = "number_gap"
severity = "warning"
values = { min_gap_mm = 0.5, max_gap_mm = 5.0 }
source = { doc = "fmp", section = "ADR 0038" }
note = { de = "Entscheidung des Nutzers vom 2026-11-09, gemeinsam mit freemapper-courseplan (dessen ADR 0032): Zwischen Postenkreis und Nummer liegen mindestens 0,5 und höchstens 5 mm.", en = "User decision 2026-11-09, shared with freemapper-courseplan ADR 0032: at least 0.5 and at most 5 mm between control circle and number." }
