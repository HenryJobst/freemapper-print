# Base rule profile: print rules from the IOF map specifications. Format: freemapper-rules (core
# ADR 0011, after freemapper-courseplan ADR 0025), adapted in ADR 0031 and rules/README.md;
# src/rules.rs reads it with its SCHEMA.
#
# Every value is given at the base scale of its map kind (sprint 1:4000, forest 1:15000,
# schoolyard 1:1000). The program enlarges course symbols with the size factor of the print scale,
# the course factor (ADR 0018, ADR 0034).
#
# Rule keys and the values they read:
#   scale_table        rows: documented table (rules::SCHEMA, `tables`):
#                      [{ scale, size_factor, standard }, ...], one row per scale denominator
#                      a map of the kind may be drawn and printed at, ascending. size_factor is
#                      the symbol size relative to the base scale; standard = false marks a
#                      reduction the standard does not foresee (default true).
#   north_lines        spacing_metres: ground distance between north lines
#   contour_interval   proposed_metres: the contour interval `init` proposes; a map kind
#                      without a rule gets no proposal
#   course_symbol      sizes in mm of the course planning symbols (7xx), split by symbol:
#                      start_side_mm, circle_diameter_mm, number_height_mm, line_width_mm,
#                      finish_inner_mm, finish_outer_mm, marked_route_dash_mm,
#                      marked_route_gap_mm, out_of_bounds_line_mm, crossing_point_mm,
#                      out_of_bounds_hatch_angle_degrees, out_of_bounds_hatch_second_angle_degrees
#                      (optional, for a cross hatch), out_of_bounds_hatch_spacing_mm (centre to
#                      centre), out_of_bounds_hatch_line_mm, first_aid_mm, first_aid_bar_mm,
#                      refreshment_mm (outside measure), refreshment_line_mm. Angles run
#                      counter-clockwise from east and may be any number.
#                      Circle diameters are measured from line centre to line centre.
#   description_box    cell_mm: side of a control description cell printed on the map
#   course_colour      cyan_percent, magenta_percent, yellow_percent, black_percent
#   placement_weights  black_factor, brown_factor, blue_factor, other_factor: how much a mm²
#                      of map detail under a control number counts, by colour class
#   number_gap         min_gap_mm, max_gap_mm: the gap between control circle and number; with
#                      several rules the strictest wins, without one placement uses 0.5 mm
#
# Course symbol sizes were read from the ISSprOM and ISOM texts (pdftotext) and checked against
# Purple Pen's NormalCourseAppearance (petergolde/PurplePen, src/PurplePenCore/Appearance.cs and
# CourseObject.cs at commit 201417f97bb69302e3e0db123f428870e0914515).

format = 1

[profile]
id = "iof-print"
kind = "base"
name = { de = "IOF-Druckregeln", en = "IOF print rules" }

[sources.ISSprOM]
title = "ISSprOM 2019-2, International Specification for Sprint Orienteering Maps (updated version, January 2022)"

[sources.ISOM]
title = "ISOM 2017-2, International Specification for Orienteering Maps (errata up to February 2022)"

[sources.IOF-SCHOOL]
title = "IOF school symbol set 2019, as cited in ADR 0018"

[sources.IOF-PCD]
title = "IOF Map Specifications: Printing and Colour Definitions, Revision 4 (September 2024)"

[sources.IOF-CD]
title = "International Specification for Control Descriptions 2024"

[sources.fmp]
title = "freemapper-print decisions (docs/adr)"
url = "https://github.com/HenryJobst/freemapper-print/tree/main/docs/adr"

# --- Scale table (ADR 0018) -------------------------------------------------------------------

[[rules]]
id = "iofprint.scale.sprint"
key = "scale_table"
severity = "error"
map_kinds = ["sprint"]
source = { doc = "ISSprOM", section = "3.1 (base scale 1:4000, 1:3000 for the youngest age groups), 4.7 (133 % at 1:3000)" }
note = { de = "1:5000 liegt unter dem Basismaßstab und ist in der Norm nicht vorgesehen; die Symbole behalten ihre Größe (ADR 0018).", en = "1:5000 is below the base scale and not foreseen by the standard; the symbols keep their base size (ADR 0018)." }
values = { rows = [
    { scale = 3000, size_factor = 1.3333333333333333 },
    { scale = 4000, size_factor = 1.0 },
    { scale = 5000, size_factor = 1.0, standard = false },
] }

[[rules]]
id = "iofprint.scale.schoolyard"
key = "scale_table"
severity = "error"
map_kinds = ["schoolyard"]
source = { doc = "IOF-SCHOOL", section = "base scale 1:1000" }
values = { rows = [{ scale = 1000, size_factor = 1.0 }] }

[[rules]]
id = "iofprint.scale.forest"
key = "scale_table"
severity = "error"
map_kinds = ["forest"]
source = { doc = "ISOM", section = "2.9.1 and 3.7 (base scale 1:15000; 150 % at 1:10000, 300 % at 1:5000, so 200 % at 1:7500)" }
note = { de = "1:20000 liegt unter dem Basismaßstab und ist in der Norm nicht vorgesehen; die Symbole behalten ihre Größe (ADR 0018).", en = "1:20000 is below the base scale and not foreseen by the standard; the symbols keep their base size (ADR 0018)." }
values = { rows = [
    { scale = 5000, size_factor = 3.0 },
    { scale = 7500, size_factor = 2.0 },
    { scale = 10000, size_factor = 1.5 },
    { scale = 15000, size_factor = 1.0 },
    { scale = 20000, size_factor = 1.0, standard = false },
] }

# --- North lines (ADR 0027) -------------------------------------------------------------------

[[rules]]
id = "iofprint.north_lines.sprint"
key = "north_lines"
severity = "hint"
map_kinds = ["sprint"]
values = { spacing_metres = 120.0 }
source = { doc = "ISSprOM", section = "4.6, symbol 601 (30 mm at 1:4000)" }

[[rules]]
id = "iofprint.north_lines.schoolyard"
key = "north_lines"
severity = "hint"
map_kinds = ["schoolyard"]
values = { spacing_metres = 37.5 }
source = { doc = "fmp", section = "ADR 0027" }
note = { de = "Arbeitswert des Projektinhabers (37,5 mm bei 1:1000), nicht am IOF-Schulsymbolsatz geprüft.", en = "Working value from the project owner (37.5 mm at 1:1000), not checked against the IOF school symbol set." }

[[rules]]
id = "iofprint.north_lines.forest"
key = "north_lines"
severity = "hint"
map_kinds = ["forest"]
values = { spacing_metres = 300.0 }
source = { doc = "ISOM", section = "3.6, symbol 601 (20 mm at 1:15000)" }

# --- Contour interval proposed by init (ADR 0025) ---------------------------------------------

[[rules]]
id = "iofprint.contour.sprint"
key = "contour_interval"
severity = "hint"
map_kinds = ["sprint"]
values = { proposed_metres = 2.0 }
source = { doc = "ISSprOM", section = "3.2 (2 m or 2.5 m)" }

[[rules]]
id = "iofprint.contour.forest"
key = "contour_interval"
severity = "hint"
map_kinds = ["forest"]
values = { proposed_metres = 5.0 }
source = { doc = "ISOM", section = "2.10 (5 m, 2.5 m in flat terrain)" }

