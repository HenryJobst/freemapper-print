[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/HenryJobst/freemapper-print"
rust-version = "1.88"

[workspace.dependencies]
freemapper-print = { path = "crates/freemapper-print" }
pdf-writer = "0.15.0"
miniz_oxide = "0.9.1"
quick-xml = "0.42.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.2.1"
serde = { version = "1", features = ["derive"] }
tempfile = "3.27.0"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
subsetter = { version = "0.2.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
