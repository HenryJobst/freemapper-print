[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/HenryJobst/freemapper-print"
rust-version = "1.88"

[workspace.dependencies]
freemapper-print = { path = "crates/freemapper-print" }
# The suite's own crates are exempt from the two-week rule (ADR 0006).
freemapper-text = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.2.0" }
freemapper-rules = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.2.0" }
freemapper-fs = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.2.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fluent-bundle = "=0.16.0"
fs4 = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
quick-xml = "0.42.0"
# Windows only: the file identity check before restoring permissions (ADR 0041); the version
# freemapper-fs uses.
same-file = "=1.0.6"
serde = { version = "1", features = ["derive"] }
# Same CSS tokenizer and IRI parser as usvg, so that logo SVGs are checked the way usvg reads them.
simplecss = "0.2.2"
svgtypes = "0.16.1"
subsetter = { version = "0.2.6", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
# Paths only: no text, fonts, svgz or writer (logos on the sheet layer).
usvg = { version = "0.49.0", default-features = false }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
