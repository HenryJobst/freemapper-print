[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/HenryJobst/freemapper-print"
rust-version = "1.88"

[workspace.dependencies]
freemapper-print = { path = "crates/freemapper-print" }
# The suite's own crates are exempt from the two-week rule (ADR 0006).
freemapper-text = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.21.1" }
freemapper-rules = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.21.1" }
freemapper-fs = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.21.1" }
freemapper-omap = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.21.1" }
freemapper-printrules = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.21.1" }
freemapper-render = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.21.1" }
freemapper-course = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.21.1" }
freemapper-web = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.21.1" }
# The suite contract with its fixtures; tests only (ADR 0050).
freemapper-contract = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.21.1", default-features = false }
anyhow = "1.0.104"
# The versions freemapper-web uses (freemapper-core v0.21.1); move them together with the core tag.
axum = { version = "=0.8.9", default-features = false }
rust-embed = { version = "=8.13.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
# The version freemapper-text uses; move it together with the core tag (ADR 0042).
fluent-bundle = "=0.16.0"
fs4 = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
quick-xml = "0.42.0"
# Pinned: newer releases are younger than two weeks (ADR 0006). rmcp-macros is held at 3.6.0 in
# Cargo.lock only (rmcp asks for ^3.6.0), so build with --locked. The version freemapper uses.
rmcp = { version = "=3.6.0", features = ["server", "transport-io", "macros"] }
# Windows only: the file identity check before restoring permissions (ADR 0041); the version
# freemapper-fs uses.
same-file = "=1.0.6"
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
# Same CSS tokenizer and IRI parser as usvg, so that logo SVGs are checked the way usvg reads them.
simplecss = "0.2.2"
svgtypes = "0.16.1"
subsetter = { version = "0.2.6", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
# The MCP server's runtime: stdio and the in-process tests.
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "signal"] }
toml = "1.2.1"
# Paths only: no text, fonts, svgz or writer (logos on the sheet layer).
usvg = { version = "0.49.0", default-features = false }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
