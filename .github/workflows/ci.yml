name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The tests that sign a manifest with the minisign CLI fail instead of skipping when it is
      # missing. They are unix-only, so Windows needs no minisign.
      FREEMAPPER_PRINT_TEST_REQUIRE_MINISIGN: "1"
    steps:
      # Actions pinned to commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install minisign
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Install minisign
        if: runner.os == 'macOS'
        run: brew install minisign
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The update command against a stub server: only a debug build with this feature reaches it.
      - run: cargo clippy --locked -p freemapper-print-cli --all-targets --features test-stub -- -D warnings
      - run: cargo test --locked -p freemapper-print-cli --features test-stub
