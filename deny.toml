# cargo-deny: licences, advisories, bans and sources of the dependencies (ADR 0068).
# Run `cargo deny check` before a release; CI runs it on every push.

[graph]
# The release builds; the dev tools are not shipped.
all-features = false

[licenses]
# freemapper-print is AGPL-3.0-or-later (ADR 0067). A dependency may use any of these, or an expression such as
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later" that offers one of them. A licence that is not listed fails the check:
# decide on it and add it here with the ADR.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
# Known vulnerabilities and yanked or unmaintained crates come from the RustSec database.
yanked = "deny"
# Each ignore names the advisory, why it does not reach this program, and when to look again.
ignore = [
    # `chrono` is unmaintained. It reaches the graph through rmcp and schemars, and neither has a release
    # without it; the advisory names missing maintenance, not a vulnerability (ADR 0068, amendment 2026-11-19).
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; reachable through rmcp/schemars, no release without it" },
]

[bans]
# Two versions of one crate are common while its users move at different speeds; only report them.
multiple-versions = "warn"
# The workspace and the freemapper-core crates are path or git dependencies without a version.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# freemapper-core, pinned by tag (ADR 0042).
allow-git = ["https://github.com/HenryJobst/freemapper-core"]
