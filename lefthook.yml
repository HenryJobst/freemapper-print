pre-commit:
  commands:
    fmt:
      run: cargo fmt --all --check
    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    # The gates that need no build (ADR 0070). The tools come from `cargo install` or a release
    # archive; CI installs the pinned versions.
    gates:
      run: scripts/check.sh spdx typos links machete actions adr changelog

# The history scan costs more than a commit should wait for. CI blocks a push that carries a
# secret anyway; this catches it before the push.
pre-push:
  commands:
    secrets:
      run: scripts/check.sh secrets
