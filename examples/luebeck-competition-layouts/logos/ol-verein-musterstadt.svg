<?xml version="1.0" encoding="UTF-8"?>
<!-- Fictional club logo "OL-Verein Musterstadt", made by hand for the freemapper-print example
     luebeck-competition-layouts. CC0 1.0. Only plain shapes: the letters are strokes, not text. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="210" height="60" viewBox="0 0 210 60">
  <title>OL-Verein Musterstadt (fictional)</title>
  <rect x="0" y="0" width="210" height="60" fill="#ffffff"/>
  <!-- Control flag: white and orange, split along the diagonal. -->
  <polygon points="4,4 56,4 4,56" fill="#ffffff"/>
  <polygon points="56,4 56,56 4,56" fill="#f07800"/>
  <rect x="4" y="4" width="52" height="52" fill="none" stroke="#333333" stroke-width="1.5"/>
  <!-- OL-VEREIN: letters 10 units high, scaled to 22. -->
  <g transform="translate(66,6) scale(2.2)" fill="none" stroke="#1a3a7a" stroke-width="1.3"
     stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="0" width="6" height="10" rx="3" ry="3"/>
    <polyline points="8.5,0 8.5,10 13.5,10"/>
    <line x1="15.5" y1="5.5" x2="19.5" y2="5.5"/>
    <polyline points="22,0 25,10 28,0"/>
    <path d="M35.5,0 H30.5 V10 H35.5 M30.5,5 H34.7"/>
    <path d="M38,10 V0 H41.5 A2.5,2.5 0 0 1 41.5,5 H38 M41,5 L44,10"/>
    <path d="M51.5,0 H46.5 V10 H51.5 M46.5,5 H50.7"/>
    <line x1="54" y1="0" x2="54" y2="10"/>
    <polyline points="56.5,10 56.5,0 62.5,10 62.5,0"/>
  </g>
  <!-- MUSTERSTADT: the same letters, scaled to the width of the first line. -->
  <g transform="translate(66,36) scale(1.528)" fill="none" stroke="#1a3a7a" stroke-width="1.7"
     stroke-linejoin="round" stroke-linecap="round">
    <polyline points="0,10 0,0 3,6 6,0 6,10"/>
    <path d="M8.5,0 V7 A3,3 0 0 0 14.5,7 V0"/>
    <path d="M22.6,1.4 C21.6,-0.2 17.4,-0.2 17.4,2.6 C17.4,5.4 22.6,4.6 22.6,7.4 C22.6,10.3 18.2,10.4 17.2,8.6"/>
    <path d="M25.5,0 H31.5 M28.5,0 V10"/>
    <path d="M39,0 H34 V10 H39 M34,5 H38.2"/>
    <path d="M41.5,10 V0 H45 A2.5,2.5 0 0 1 45,5 H41.5 M44.5,5 L47.5,10"/>
    <path d="M55.6,1.4 C54.6,-0.2 50.4,-0.2 50.4,2.6 C50.4,5.4 55.6,4.6 55.6,7.4 C55.6,10.3 51.2,10.4 50.2,8.6"/>
    <path d="M58.5,0 H64.5 M61.5,0 V10"/>
    <path d="M67,10 L70,0 L73,10 M68.1,6.5 H71.9"/>
    <path d="M75.5,0 H78 A3.5,5 0 0 1 78,10 H75.5 Z"/>
    <path d="M84,0 H90 M87,0 V10"/>
