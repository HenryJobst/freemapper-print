# freemapper-print event project file, format 1
# Paths are relative to this file.

format = 1

[event]
title = "Stadtsprint Lübeck"
date = 2027-05-15
organiser = "OL-Verein Musterstadt"
lang = "de"

[sources]
map = "luebeck.omap"

[map]
kind = "sprint"
# init schlug 2,5 m vor; der Informationsblock der Karte nennt 2 m.
contour_interval_m = 2.0

# Quellenangaben und Namensnennung stehen in der Fußzeile links unten, unter dem Kartenausschnitt, wenn das Passepartout breit genug ist, sonst im Kartenausschnitt. Ein Element copyright_line oder credit_line verschiebt sie.
# Zwei Zeilen statt der vier aus den Kartennotizen: So passt die Fußzeile beim A3-Layout unter den Kartenausschnitt.
[print]
copyright = """
© OpenStreetMap contributors, ODbL · © GeoBasis-DE/LVermGeo SH/CC BY 4.0 (Quelle verändert), Lizenz: https://creativecommons.org/licenses/by/4.0/
Karte erstellt mit freemapper – https://github.com/HenryJobst/freemapper
"""

# Gemeinsame Elemente: auf jedem Blatt, in Millimetern auf dem Papier, unabhängig vom Druckmaßstab.

[[shared]]
id = "title"
kind = "title_block"
lines = [
    "{event}",
    "{date} · {organiser}",
    "1:{print_scale} · Äquidistanz {contour_interval}",
]
anchor = { to = "map_frame", corner = "top_left", offset_mm = [2.0, 2.0] }

[[shared]]
id = "scale_check_bar"
kind = "scale_check_bar"
anchor = { to = "map_frame", corner = "bottom_right", offset_mm = [2.0, 2.0] }

[[shared]]
id = "club_logo"
kind = "logo"
file = "logos/ol-verein-musterstadt.svg"
width_mm = 35.0
anchor = { to = "map_frame", corner = "top_right", offset_mm = [2.0, 2.0] }

[[shared]]
id = "sponsor_logo"
kind = "logo"
file = "logos/beispiel-sponsor.png"
width_mm = 32.0
anchor = { to = "map_frame", corner = "top_right", offset_mm = [2.0, 14.0] }

# Ältere Klassen: A4 im Maßstab der Karte. Die Karte ist höher als der Kartenausschnitt, check meldet den Überstand.

[[layouts]]
id = "a4-4000"
paper = "A4"
orientation = "landscape"
print_scale = 4000
map_frame = { margin_mm = 10.0 }

[[layouts.elements]]
id = "classes"
kind = "text"
lines = ["Ältere Klassen: D/H 14 und älter"]
anchor = { to = "map_frame", corner = "top_left", offset_mm = [2.0, 16.5] }

# Jüngste Klassen: A3 in 1:3000, Symbole auf 133 % (ISSprOM 2019-2, 3.1).

[[layouts]]
id = "a3-3000"
paper = "A3"
orientation = "landscape"
print_scale = 3000
map_frame = { margin_mm = 10.0 }

[[layouts.elements]]
id = "classes"
kind = "text"
lines = ["Jüngste Klassen: D/H 10 und D/H 12"]
anchor = { to = "map_frame", corner = "top_left", offset_mm = [2.0, 16.5] }
