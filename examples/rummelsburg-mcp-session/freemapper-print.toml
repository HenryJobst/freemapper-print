# freemapper-print event project file, format 1
# Paths are relative to this file.

format = 1

[event]
title = "Rummelsburg Training"
lang = "de"

[sources]
map = "rummelsburg.omap"
courses = "rummelsburg-training.ppen"

[map]
kind = "sprint"
# Der Informationsblock der Karte nennt 2,5 m.
contour_interval_m = 2.5

# Die Karte hat keine Kartennotizen. Die Fußzeile nennt deshalb von Hand die Karte und ihren Autor.
[print]
copyright = """
Karte: Rummelsburger Bucht, Remo Madella, MOO Challenge Berlin 2025
"""

# Quellenangaben und Namensnennung stehen in der Fußzeile links unten, unter dem Kartenausschnitt,
# wenn das Passepartout breit genug ist, sonst im Kartenausschnitt. Ein Element copyright_line oder
# credit_line verschiebt sie.
[[shared]]
id = "title"
kind = "title_block"
lines = [
    "{event} · {course}",
    "1:{print_scale} · {contour_interval}",
]

[shared.anchor]
to = "map_frame"
corner = "top_left"
offset_mm = [
    2.0,
    2.0,
]

[[shared]]
id = "scale_check_bar"
kind = "scale_check_bar"

[shared.anchor]
to = "map_frame"
corner = "bottom_right"
offset_mm = [
    2.0,
    2.0,
]

[[layouts]]
id = "a4-4000"
paper = "A3"
orientation = "auto"
print_scale = 4000
north_lines = "auto"

[layouts.map_frame]
margin_mm = 8.0
border_mm = 0.25
crop = true

[[layouts.elements]]
id = "descriptions"
kind = "control_descriptions"

[layouts.elements.anchor]
to = "map_frame"
corner = "top_right"
offset_mm = [
    2.0,
    2.0,
]

[[assignments]]
mask = "window-T"
course = "T"
layout = "a4-4000"

