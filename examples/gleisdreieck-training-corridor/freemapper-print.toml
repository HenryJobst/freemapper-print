# freemapper-print event project file, format 1
# Paths are relative to this file.

format = 1

[event]
title = "Korridortraining Gleisdreieck"
date = 2027-05-15
organiser = "OL-Verein Musterstadt"
lang = "de"

[sources]
map = "gleisdreieck.omap"
courses = "gleisdreieck-corridor.ppen"

[map]
kind = "sprint"
# Der Informationsblock der Karte nennt 2,5 m. Der Vorschlag von init (2 m) ist geändert.
contour_interval_m = 2.5

# Quellenangaben und Namensnennung stehen in der Fußzeile links unten, unter dem Kartenausschnitt,
# wenn das Passepartout breit genug ist, sonst im Kartenausschnitt. Ein Element copyright_line oder
# credit_line verschiebt sie.
# Die Karte hat keine Kartennotizen, deshalb stehen die Quellen hier.
[print]
copyright = """
Karte: Remo Madella, MOO Challenge Berlin 2025
Bahn: freemapper-courseplan 0.14.1
"""

# Gemeinsame Elemente: auf jedem Blatt, in Millimetern auf dem Papier, unabhängig vom Druckmaßstab.

[[shared]]
id = "title"
kind = "title_block"
lines = [
    "{event} · Bahn {course}",
    "{date} · {length_km} km · {controls} Posten",
    "1:{print_scale} · Äquidistanz {contour_interval}",
]
anchor = { to = "map_frame", corner = "top_left", offset_mm = [2.0, 2.0] }

[[shared]]
id = "scale_check_bar"
kind = "scale_check_bar"
anchor = { to = "map_frame", corner = "bottom_right", offset_mm = [2.0, 2.0] }

# Das Vereinszeichen ist für dieses Beispiel gezeichnet (CC0).
[[shared]]
id = "club_logo"
kind = "logo"
file = "logos/kompass.svg"
width_mm = 14.0
anchor = { to = "map_frame", corner = "top_right", offset_mm = [2.0, 2.0] }

# Eine freie Seite von 170 mm × 380 mm (page_mm) statt A3: Der Korridor ist 320 mm lang und nur 100 mm
# breit. Gedruckt wird sie auf A3 (297 mm × 420 mm). Der Ausschnitt liegt auf dem Korridor
# (map_frame.centre_map_mm); crop = true schneidet die Karte mit Absicht dort ab.
# Die Elemente stehen dort, wo der Korridor nicht ist: Maßstabsbalken oben rechts, Beschreibungskasten
# unten rechts, Vereinszeichen unten links.

[[layouts]]
id = "korridor-4000"
page_mm = [170.0, 380.0]
orientation = "portrait"
print_scale = 4000
map_frame = { margin_mm = 10.0, crop = true, centre_map_mm = [85.0, 118.0] }
hide_shared = ["scale_check_bar", "club_logo"]

[[layouts.elements]]
id = "scale_check_bar_top"
kind = "scale_check_bar"
anchor = { to = "map_frame", corner = "top_right", offset_mm = [2.0, 2.0] }

[[layouts.elements]]
id = "club_logo_bottom"
kind = "logo"
file = "logos/kompass.svg"
width_mm = 14.0
anchor = { to = "map_frame", corner = "bottom_left", offset_mm = [2.0, 2.0] }

[[layouts.elements]]
id = "descriptions"
kind = "control_descriptions"
anchor = { to = "map_frame", corner = "bottom_right", offset_mm = [2.0, 2.0] }

[[assignments]]
mask = "corridor-1"
course = "C"
layout = "korridor-4000"

